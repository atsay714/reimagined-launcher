name: Launcher Tests

on:
  pull_request:
    branches: [main, macos]
  push:
    branches: [main, macos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Canonical Mac temporary path
        if: runner.os == 'macOS'
        run: |
          mkdir -p /private/tmp/reimagined-launcher-tests
          echo 'TMPDIR=/private/tmp/reimagined-launcher-tests' >> "$GITHUB_ENV"
      - name: Mac release tooling tests
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s macos/tests -v
      - name: Restore
        run: dotnet restore ReimaginedLauncher.sln
      - name: Build
        run: dotnet build ReimaginedLauncher.sln --no-restore
      - name: Test
        run: dotnet test ReimaginedLauncher.Tests/ReimaginedLauncher.Tests.csproj --no-build --no-restore --logger "console;verbosity=normal"
